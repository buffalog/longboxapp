services:
  longbox:
    image: longbox:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: longbox
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ${DB_PATH}:/data
      - ${LIBRARY_PATH}:/library
      # Phase B watch folder. Bind-mounted as writable (Step 6 will
      # move files out of it). Optional — when DOWNLOAD_WATCH_HOST is
      # unset the mount is just an empty in-container directory, and
      # Phase B sees no candidates.
      - ${DOWNLOAD_WATCH_HOST:-./.empty-watch}:/watch
    environment:
      LIBRARY_ROOT_PATH: /library
      DATABASE_URL: "sqlite:/data/longbox.db?mode=rwc"
      BIND_ADDR: "0.0.0.0:3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MATCH_THRESHOLD: ${MATCH_THRESHOLD:-0.85}
      COMICVINE_API_KEY: ${COMICVINE_API_KEY}
      # Item A v2 forward-calendar (Metron). Empty defaults boot the
      # container cleanly even without an account — the metron_enabled
      # settings row is the actual gate; bad/missing credentials with
      # the row flipped on degrade to "forward weeks return empty" with
      # a single warn log at boot.
      METRON_API_USER: ${METRON_API_USER:-}
      METRON_API_PASSWORD: ${METRON_API_PASSWORD:-}
      # Phase B: when set, web spawns the post-process watcher at boot.
      # Maps to the /watch bind mount above.
      DOWNLOAD_WATCH_PATH: ${DOWNLOAD_WATCH_PATH:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

