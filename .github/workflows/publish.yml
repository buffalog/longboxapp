name: Publish image

# Publishes the multi-arch container image to GHCR. Runs ONLY on version tag
# pushes (v*) — never on push-to-main or PRs — so work-in-progress commits are
# never published. workflow_dispatch allows a build-only dry run (push
# defaults to false) to confirm both arches compile without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      push:
        description: 'Publish the image (else build-only dry run)'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_IMAGE: ghcr.io/buffalog/longbox

jobs:
  # One job per arch, each on its NATIVE runner (no QEMU — emulated Rust
  # builds are impractically slow). Each pushes its arch by digest; the merge
  # job assembles the multi-arch manifest.
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Resolve push flag + platform pair
        id: cfg
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.push }}" = "true" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
          platform="${{ matrix.platform }}"
          echo "pair=${platform//\//-}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.cfg.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and maybe push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=${{ steps.cfg.outputs.push }}

      - name: Export digest
        if: steps.cfg.outputs.push == 'true'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: steps.cfg.outputs.push == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.cfg.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assemble the per-arch digests into one multi-arch manifest list and apply
  # the version / latest tags. Skipped on a build-only dry run.
  merge:
    name: Merge manifest + tag
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'push' || inputs.push }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          # Stable release v2.2.0 -> tags 2.2.0, 2.2, and latest (latest=auto
          # skips prereleases like v2.2.0-rc1). A workflow_dispatch publish has
          # no tag, so fall back to a sha tag there.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create + push manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          # Word-splitting is intentional: expand the -t tags and the
          # per-arch @sha256 digest refs into separate args (Docker's
          # canonical multi-platform pattern).
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}
