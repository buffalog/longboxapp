[package]
name = "longbox-scanner"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
description = "LongBox library scanner: walks the disk, matches against the DB."

[lints]
workspace = true

[dependencies]
longbox-core = { path = "../longbox-core" }
longbox-db = { path = "../longbox-db" }
serde = { version = "1", features = ["derive"] }
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["macros", "sync", "rt-multi-thread", "fs"] }
tracing = "0.1"
thiserror = "1"
time = { version = "0.3" }

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
