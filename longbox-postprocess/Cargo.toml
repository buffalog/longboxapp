[package]
name = "longbox-postprocess"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
description = "LongBox Phase B post-process pipeline: watch-folder import."

[lints]
workspace = true

# Phase B step 6 adds the processing pipeline: `longbox-core` (matcher,
# ComicInfo writer, LibraryPath), `zip` (CBZ rewrite), `tempfile`
# (atomic-rename temp paths in the target dir).
[dependencies]
longbox-core = { path = "../longbox-core" }
longbox-db = { path = "../longbox-db" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
time = { version = "0.3", features = ["serde", "macros", "serde-human-readable"] }
thiserror = "1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
notify = "8"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
# Set file mtime back so tests skip the 2 s stability sleep.
filetime = "0.2"
