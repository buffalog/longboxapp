[workspace]
resolver = "2"
members = ["longbox-core", "longbox-db", "longbox-comicvine", "longbox-metron", "longbox-newznab", "longbox-downloader", "longbox-scanner", "longbox-web", "longbox-postprocess", "longbox-pull", "longbox-scan-scheduler", "longbox-webhooks", "longbox-archive", "longbox-cv-enrichment", "longbox-opds"]

[workspace.package]
edition = "2021"
version = "2.1.0"
license = "GPL-3.0-or-later"
rust-version = "1.78"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
