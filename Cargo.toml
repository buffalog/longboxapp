[workspace]
resolver = "2"
members = ["longbox-core", "longbox-db", "longbox-comicvine", "longbox-scanner", "longbox-web"]

[workspace.package]
edition = "2021"
version = "0.0.1"
license = "MIT"
rust-version = "1.78"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
