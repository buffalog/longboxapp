[package]
name = "longbox-web"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
description = "LongBox Axum HTTP server and embedded SvelteKit shell."

[lints]
workspace = true

[[bin]]
name = "longbox"
path = "src/main.rs"

[dependencies]
longbox-core = { path = "../longbox-core" }
longbox-db = { path = "../longbox-db" }
longbox-comicvine = { path = "../longbox-comicvine" }
longbox-scanner = { path = "../longbox-scanner" }
longbox-postprocess = { path = "../longbox-postprocess" }
longbox-newznab = { path = "../longbox-newznab" }
longbox-downloader = { path = "../longbox-downloader" }
longbox-pull = { path = "../longbox-pull" }
longbox-scan-scheduler = { path = "../longbox-scan-scheduler" }
longbox-webhooks = { path = "../longbox-webhooks" }
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"
ulid = { version = "1", features = ["serde"] }
time = { version = "0.3", features = ["serde", "macros", "serde-human-readable"] }
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls", "migrate"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
hyper = "1"
http-body-util = "0.1"
pretty_assertions = "1"
tempfile = "3"
wiremock = "0.6"
zip = { version = "2", default-features = false, features = ["deflate"] }
